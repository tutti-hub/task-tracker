services:
  tracker_db:
    image: postgres:16-alpine
    container_name: task-tracker-db
    environment:
      POSTGRES_DB: task_tracker
      POSTGRES_USER: gordon  
      POSTGRES_PASSWORD: freeman
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gordon -d task_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
